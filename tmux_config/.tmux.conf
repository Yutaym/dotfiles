#################################################
#
#  BASIC Setting
#

#  256 色端末を使用する
set -g default-terminal 'screen-256color'
set -g terminal-overrides 'xterm:colors=256'

#
#  Prefix キーを Ctrl-b から Ctrl-q に変更
#  （Ctrl-j は Windows の psmux で Prefix として認識されなかったため使わない）
#
set -g prefix C-q
unbind C-b
bind C-q send-prefix   # Prefix を 2 回押すとアプリに Ctrl-q を送る

set -g base-index 1         # ウィンドウの番号を 1 から開始
setw -g pane-base-index 1   # ペインの番号を 1 から開始

set-option -g renumber-windows on   # ウィンドウを閉じた時に番号を詰める

set -s escape-time 0
set-option -g mouse on

# message表示時のstatus lineの色。dispaly,confirm-before -p などのコマンド出力の色
set -g message-style fg=colour68,reverse,bg=brightwhite

# paneを区切っている線の色
set -g pane-active-border-style fg=colour111,bg=colour236
set -g pane-border-style fg=colour111,bg=colour236

#################################################
#
#  KEY BINDING Setting
#

#  Prefix + vim のキーバインドでペインを移動する
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

#  Prefix + vim のキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R 5

#  vimのコピーを適用
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

#  Ctrl-o でペインをローテーションしながら移動
bind -n C-o select-pane -t :.+

bind -r C-h select-window -t :-     # Prefix + Ctrl-h でウィンドウ切り替え
bind -r C-l select-window -t :+     # Prefix + Ctrl-l でウィンドウ切り替え

bind | split-window -h -c '#{pane_current_path}'    # Prefix + | でペインを垂直分割する
bind - split-window -v -c '#{pane_current_path}'    # Prefix + - でペインを水平分割する


# 設定ファイルをリロード
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message 'Reloard was successful.'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#################################################
#
#  STATUS BAR Setting
#

set-option -g status-position top       # ステータスバーをトップに配置する
set -g status-interval 1                # ステータスバー更新速度 15s(default) → 1s

#  Length
set -g status-left-length 90
set -g status-right-length 90

#  Contents（配色は VS Code の One Dark Pro を元にする: バー #21252b、帯 #4d78cc、アクティブ #61afef、非アクティブ #3e4452）
set -g status-style 'fg=#9da5b4,bg=#21252b'  # 文字色・背景色（psmux は status-fg / status-bg に対応していない）

#  2 段にする。1 段目（status-format[0] の既定）は左にセッション名、続けてウィンドウ一覧を出し、
#  2 段目（status-format[1]）の左に Prefix / コピーモードの表示、右にバッテリー残量と時刻を出す
set -g status 2
#  left: セッション名:現在のウィンドウ番号（Prefix やコピーモードに関係なく、常に同じ色の帯で出す）。長い名前は 10 文字で切る
set -g status-left-style default
set -g status-left '#[fg=#ffffff, bg=#4d78cc, bold] #{=/10/…:session_name}:#I #[fg=#4d78cc, bg=#21252b]'
set -g status-right ''

#  2 段目の中身はユーザーオプションに置き、#{T:...} で展開する
#  （status-format は strftime を通らないので、T: で時刻（%m など）も展開させる）
set -g status-format[1] '#{T:@status2-left}#[align=right]#{T:@status2-right}'
#  左: Prefix を押している間は Wait、コピーモード中は Copy
set -g @status2-left '#{?client_prefix,#[fg=#ffffff]#[bg=#4d78cc]#[bold] Wait #[default],}#{?pane_in_mode,#[fg=#ffffff]#[bg=#4d78cc]#[bold] Copy #[default],}'
#  右: 📁 (今のフォルダ名) | ⚡🔋: (バッテリー残量) % | MM/dd HH:mm EEE
#      ssh 中は 📁 の代わりに 🌐 (接続先)。接続先はシェルの ssh 関数（PowerShell は powershell_function.ps1、zsh は zshrc_function.sh）と
#      ssh-generate の start-ssh.ps1 がペインのオプション @ssh_host に入れる。@ssh_host が無くても ssh が動いていれば 🌐 ssh と出す
#  バッテリーの取り方が tmux と psmux で違うので、下の PLUGIN Setting の %if の中で @status2-right をそれぞれ設定する

# Window Status
setw -g window-status-separator "" # window間の隙間を排除
set-option -g status-justify 'left'   # window-status を左寄せ
# 非アクティブウィンドウ（番号と名前）
setw -g window-status-format '#[fg=#21252b, bg=#3e4452]#[fg=#dcdcdc, bg=#3e4452, bold] #I:#{T:@wname} #[fg=#3e4452, bg=#21252b]'
# アクティブウィンドウ（番号と名前）
setw -g window-status-current-format '#[fg=#21252b, bg=#61afef]#[fg=#21252b, bg=#61afef, bold] #I:#{T:@wname} #[fg=#61afef, bg=#21252b]'

# ウィンドウ名の長さ: 1 段目に収まるように、((画面の幅 - 17) / ウィンドウ数 - 7) 文字で切り、… を付ける
# （17 は status-left（セッション名は最大 10 文字＋…・":番号"・空白・区切り記号）の分、7 は名前以外の区切り記号・空白・…・"番号:" の分。psmux は #{=/#{...}/:...} のように長さに #{} を書けないので、
#   幅やウィンドウ数が分からないとき（tmux の起動時でセッションもクライアントも無いとき）は 80 と 1 にする。フックで set -gF し、@wname に "#{=/11/…:window_name}" のような書式を作って #{T:@wname} で展開する）
set -gF @wname '##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},17},#{?session_windows,#{session_windows},1}},7}/…:window_name}'
set-hook -g client-resized 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},17},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'
set-hook -g after-new-window 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},17},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'
set-hook -g window-unlinked 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},17},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'

#################################################
#
#  PANE Setting
#

#  ベーシックペイン
set -g window-style 'fg=white, bg=colour240'

#  アクティブペイン
set -g window-active-style 'fg=white, bg=colour236'

#  Extended Keys（tmux のみ。psmux はこの 2 つのオプションに対応しておらず、起動時に警告が出るため読み込まない）
%if "#{!:#{m:*psmux*,#{socket_path}}}"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'   # ステータスバーの #RRGGBB の色をそのまま出す（24 ビットカラー）
%endif
#  Ctrl+Enter: psmux は Windows で LF に変えて渡す（#409）ため、CSI u（ESC[13;5u）をそのまま送る
bind -n C-Enter send-keys -H 1b 5b 31 33 3b 35 75

#################################################
#
#  PLUGIN Setting
#
#  tmux は tpm、psmux（Windows）は ppm（tpm の PowerShell 版）でプラグインを管理する
#  socket_path に psmux が含まれるか（psmux は ~/.psmux/<名前>、tmux は /tmp/tmux-<UID>/<名前>）で見分ける
#
#  Prefix + I: プラグインのインストール
#  Prefix + U: プラグインの更新
#  Prefix + Alt-u（tmux）/ Prefix + M（psmux）: リストに無いプラグインの削除

%if "#{m:*psmux*,#{socket_path}}"
# --- psmux: ppm（install_tmux.ps1 が ~/.psmux/plugins/ppm に入れる）
# psmux は @plugin の行で各プラグインの plugin.conf を読み込む
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-resurrect'    # Prefix + Ctrl-s で保存、Prefix + Ctrl-r で復元
set -g @plugin 'psmux-plugins/psmux-continuum'    # 15 分ごとに自動保存

# ステータスバー 2 段目の右側（tmux 側と同じく、プラグインを使わずに書く）
# - Prefix の表示: psmux-prefix-highlight は status-right を丸ごと上書きするので使わず、client_prefix / pane_in_mode で直接書く（@status2-left）
# - バッテリー: psmux-battery は試したときに値が「…」のまま変わらなかったので使わず、#() で直接取得する
#   #() は cmd /C で実行され、括弧や % をそのまま書けないので、次の PowerShell を -EncodedCommand（UTF-16LE の Base64）で渡す
#   （充電中・AC につながっているとき（BatteryStatus が 1 以外）は ⚡ を付ける。絵文字は cmd /C を通すと化けるので、出力を UTF-8 にし、[char] で作る）
#     [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false); $b = Get-CimInstance Win32_Battery; $i = [char]::ConvertFromUtf32(0x1F50B); if ($b) { $c = if ($b.BatteryStatus -ne 1) { [char]0x26A1 } else { "" }; "$c$($i): $($b.EstimatedChargeRemaining) %" } else { "$($i): AC" }
set -g status-interval 15   # #() のたびに pwsh を起動するので短くしない
# 1 段目: psmux は status 2 にすると、既定の 1 段目でウィンドウ番号を帯の外に別に出すので、
# window-status-format / window-status-current-format でウィンドウ一覧を書く
# 左に status-left を出し、ウィンドウは #[range=window|番号] で囲み、クリックでそのウィンドウに移れるようにする（tmux の既定の status-format[0] と同じ書き方）
set -g status-format[0] '#[align=left range=left]#{T:status-left}#[norange default]#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default],#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange default]}'
set -g @status2-right '#[fg=#4d78cc, bg=#21252b]#[fg=#ffffff, bg=#4d78cc, bold] #{?@ssh_host,🌐 #{@ssh_host},#{?#{==:#{pane_current_command},ssh},🌐 ssh,📁 #{b:pane_current_path}}} | #(pwsh -NoProfile -NonInteractive -EncodedCommand ) | %m/%d %H:%M %a '

# ppm のキー（ppm の plugin.conf と同じ）。psmux は ppm の plugin.conf を自動では読まず、
# 下の run でも設定の再読み込み時には登録されなかったので、ここで直接割り当てる
bind I run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/install_plugins.ps1"'
bind U run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/update_plugins.ps1"'
bind M run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/clean_plugins.ps1"'

# ppm の読み込み（設定ファイルの最後に置く）
run '~/.psmux/plugins/ppm/ppm.ps1'

# psmux-continuum の client-attached フックを -b 付きで上書きする
# （psmux 3.4.0 は attach 時のフックに -b を付けずに実行し、起動時にステータスバーに "running: ..." を出すため）
set-hook -g client-attached 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-continuum/scripts/auto_save.ps1\" -IntervalMinutes 15"'

%else
# --- tmux: tpm（install_tmux.sh が ~/.config/tmux/.tmux/plugins/tpm に clone する）
# ppm は設定ファイルの "set -g @plugin" の行を文字列で探してインストールするので、
# psmux に拾わせないように tmux 用の行は set-option と書く
# プラグインは psmux 側と同じもの（resurrect / continuum）にそろえる
set-option -g @plugin 'tmux-plugins/tpm'
#set-option -g @plugin 'tmux-plugins/tmux-online-status'  # https://github.com/tmux-plugins/tmux-online-status
# set-option -g @plugin 'tmux-plugins/tmux-sidebar' # https://github.com/tmux-plugins/tmux-sidebar
set-option -g @plugin 'tmux-plugins/tmux-resurrect' # Prefix + Ctrl-s で保存、Prefix + Ctrl-r で復元
set-option -g @plugin 'tmux-plugins/tmux-continuum' # 15 分ごとに自動保存

# ステータスバー 2 段目の右側（psmux 側と同じく、プラグインを使わずに書く）
# - Prefix の表示: tmux-prefix-highlight の代わりに client_prefix / pane_in_mode で直接書く（@status2-left）
# - バッテリー: tmux-battery の代わりに #() で直接取得する。macOS は pmset、Linux / WSL は
#   /sys/class/power_supply/BAT*/capacity を読み、どちらも無ければ AC と出す
#   充電中・AC につながっているとき（pmset に AC Power、または /sys/.../status が Discharging 以外）は ⚡ を付ける
#   （#{T:...} で strftime を通るので、% は %% と書く。#() は対になっていない ) で終わるので、case の ) は使えない）
set -g @status2-right '#[fg=#4d78cc, bg=#21252b]#[fg=#ffffff, bg=#4d78cc, bold] #{?@ssh_host,🌐 #{@ssh_host},#{?#{==:#{pane_current_command},ssh},🌐 ssh,📁 #{b:pane_current_path}}} | #(b=`pmset -g batt 2>/dev/null | grep -Eo "[0-9]+%%" | head -n1 | tr -d "%%"`; [ -n "$b" ] || b=`cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1`; c=; pmset -g batt 2>/dev/null | grep -q "AC Power" && c=⚡; s=`cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1`; [ -n "$s" ] && [ "$s" != Discharging ] && c=⚡; [ -n "$b" ] && echo "$c🔋: $b %%" || echo "🔋: AC") | %m/%d %H:%M %a '

# https://github.com/tmux-plugins/tpm
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
%endif
