#################################################
#
#  BASIC Setting
#

#  256 色端末を使用する
set -g default-terminal 'screen-256color'
set -g terminal-overrides 'xterm:colors=256'

#  ターミナル（Windows Terminal のタブなど）のタイトルを「PSMUX <セッション名>」にする（例: PSMUX 0）
set -g set-titles on
set -g set-titles-string 'PSMUX #S'

#
#  Prefix キーを Ctrl-b から Ctrl-q に変更
#  （Ctrl-j は Windows の psmux で Prefix として認識されなかったため使わない）
#
set -g prefix C-q
unbind C-b
bind C-q send-prefix   # Prefix を 2 回押すとアプリに Ctrl-q を送る

set -g base-index 1         # ウィンドウの番号を 1 から開始
setw -g pane-base-index 1   # ペインの番号を 1 から開始

set-option -g renumber-windows on   # ウィンドウを閉じた時に番号を詰める

set -s escape-time 0
set-option -g mouse on

# message表示時のstatus lineの色。dispaly,confirm-before -p などのコマンド出力の色
set -g message-style fg=colour68,reverse,bg=brightwhite

# paneを区切っている線の色
set -g pane-active-border-style fg=colour214,bg=colour236
set -g pane-border-style fg=colour240,bg=colour236

#################################################
#
#  KEY BINDING Setting
#

#  Prefix + vim のキーバインドでペインを移動する
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

#  Prefix + vim のキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R 5

#  vimのコピーを適用
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

#  Ctrl-o でペインをローテーションしながら移動
bind -n C-o select-pane -t :.+

bind | split-window -h -c '#{pane_current_path}'    # Prefix + | でペインを垂直分割する
bind - split-window -v -c '#{pane_current_path}'    # Prefix + - でペインを水平分割する

#  Prefix の後も Ctrl を押したままで操作できるようにする
#  （IME がオンだと Prefix の後の英字キーは IME に取られて届かないが、Ctrl 付きのキーは届く）
#  C-i（Tab）・C-m（Enter）・C-[（Esc）は別のキーと区別できないので使わない
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R
bind -r C-n next-window
bind -r C-p previous-window
bind a select-window -t :^      # Prefix + a / Ctrl-a で最初のウィンドウに戻る
bind C-a select-window -t :^
bind c new-window -c '#{pane_current_path}'     # 新しいウィンドウも今のフォルダで開く
bind C-c new-window -c '#{pane_current_path}'
bind Tab last-window                            # 直前のウィンドウに戻る（tmux 既定の l はペイン移動に使っているため）
bind C-t last-window
#  Prefix + e / Ctrl-e でウィンドウ名を変える（既定の , と同じ。psmux の , は引数なしの rename-window で入力欄を出す）
%if "#{m:*psmux*,#{socket_path}}"
bind e rename-window
bind C-e rename-window
%else
bind e command-prompt -I '#W' { rename-window -- '%%' }
bind C-e command-prompt -I '#W' { rename-window -- '%%' }
%endif
#  Prefix + X / Ctrl-Shift-x で今のウィンドウ以外を閉じる（確認あり）
#  psmux 3.4.0 の kill-window -a は今のウィンドウを閉じてしまうので、スクリプトで 1 つずつ閉じる
%if "#{m:*psmux*,#{socket_path}}"
bind X confirm-before -p 'kill other windows? (y/n)' "run-shell 'pwsh -NoProfile -File \"~/dotfiles/tmux_config/kill_other_windows.ps1\" #{b:socket_path} \"#{session_name}\" #{window_id}'"
bind C-S-x confirm-before -p 'kill other windows? (y/n)' "run-shell 'pwsh -NoProfile -File \"~/dotfiles/tmux_config/kill_other_windows.ps1\" #{b:socket_path} \"#{session_name}\" #{window_id}'"
%else
bind X confirm-before -p 'kill other windows? (y/n)' 'kill-window -a'
bind C-S-x confirm-before -p 'kill other windows? (y/n)' 'kill-window -a'
%endif
#  Prefix + W / Ctrl-Shift-w でウィンドウ一覧から選んで閉じる
#  psmux 3.4.0 の choose-tree はテンプレートを無視するので、スクリプトで display-menu の一覧を作る
%if "#{m:*psmux*,#{socket_path}}"
bind W run-shell 'pwsh -NoProfile -File "~/dotfiles/tmux_config/kill_window_menu.ps1"'
bind C-S-w run-shell 'pwsh -NoProfile -File "~/dotfiles/tmux_config/kill_window_menu.ps1"'
%else
bind W choose-tree -Zw "kill-window -t '%%'"
bind C-S-w choose-tree -Zw "kill-window -t '%%'"
%endif
bind -r < swap-window -d -t -1               # ウィンドウを左右に入れ替える（一緒に移る）
bind -r > swap-window -d -t +1
bind C-v split-window -h -c '#{pane_current_path}'  # 左右に分割（vim の vsplit に合わせる）
bind C-b split-window -v -c '#{pane_current_path}'  # 上下に分割（b = below）
bind C-z resize-pane -Z
bind C-x confirm-before -p 'kill-pane #P? (y/n)' kill-pane
bind C-w choose-window
bind C-d detach-client
bind C-] paste-buffer


# 設定ファイルをリロード
#  psmux は ~/.psmux.conf（このファイルへのリンク）を読むので、読み直す先を分ける
%if "#{m:*psmux*,#{socket_path}}"
bind-key -T prefix r source-file ~/.psmux.conf \; display-message 'Reload was successful.'
%else
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; display-message 'Reload was successful.'
%endif

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#################################################
#
#  STATUS BAR Setting
#

# psmux 3.4.0 は、ステータスバーを上に置くと、その行数の分だけ、ペインの中へのクリック（離した位置）と、マウスで選択してコピーする文字が下にずれる
# （どちらもステータスバーの分を引かずに画面の行のまま使うため）。下に置けばずれないので、下に置く
set-option -g status-position bottom    # ステータスバーを下に置く
set -g status-interval 1                # ステータスバー更新速度 15s(default) → 1s

#  Length
set -g status-left-length 90
set -g status-right-length 90

#  Contents（配色は VS Code の One Dark Pro を元にする: バー #21252b、帯 #4d78cc、アクティブ #61afef、非アクティブ #3e4452）
set -g status-style 'fg=#9da5b4,bg=#21252b'  # 文字色・背景色（psmux は status-fg / status-bg に対応していない）

#  1 段にする。左にセッション名、続けてウィンドウ一覧、右に Prefix / コピーモードの表示・今のフォルダ・バッテリー残量・時刻を出す
set -g status on
#  2 段だったときに書き換えた status-format を既定に戻す（設定を読み直すだけでは、動いているサーバーに残るため）
set -gu status-format
#  psmux は status-format を既定に戻すと右側（status-right）を出さないので、tmux の既定と同じ 1 段目を書く
#  （ウィンドウは #[range=window|番号] で囲み、クリックでそのウィンドウに移れるようにする）
%if "#{m:*psmux*,#{socket_path}}"
set -g status-format[0] '#[align=left range=left]#{T:status-left}#[norange default]#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default],#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange default]}#[nolist align=right range=right]#{T:status-right}#[norange default]'
%endif
#  left: セッション名:現在のウィンドウ番号（Prefix やコピーモードに関係なく、常に同じ色の帯で出す）。長い名前は 10 文字で切る
set -g status-left-style default
set -g status-left '#[fg=#ffffff, bg=#4d78cc, bold] #{=/10/…:session_name}:#I #[fg=#4d78cc, bg=#21252b]'

#  right: 中身はユーザーオプションに置き、#{T:...} で展開する（T: で時刻（%m など）も展開させる）
set -g status-right '#{T:@status-mode}#{T:@status-info}'
#  @status-mode: Prefix を押している間は Wait、コピーモード中は Copy
set -g @status-mode '#{?client_prefix,#[fg=#ffffff]#[bg=#4d78cc]#[bold] Wait #[default],}#{?pane_in_mode,#[fg=#ffffff]#[bg=#4d78cc]#[bold] Copy #[default],}'
#  @status-info: 📁 (今のフォルダ名) | MM/dd HH:mm EEE
#      ssh 中は 📁 の代わりに 🌐 (接続先)。接続先はシェルの ssh 関数（PowerShell は powershell_function.ps1、zsh は zshrc_function.sh）と
#      ssh-generate の start-ssh.ps1 がペインのオプション @ssh_host に入れる。tmux では @ssh_host が無くても ssh が動いていれば 🌐 ssh と出す
#      （psmux は出さない。pane_current_command が一番下の子プロセスを返すので、Claude Code が MCP サーバーを ssh で起動していると ssh になるため）
#  ssh 中かどうかの見分け方が tmux と psmux で違うので、下の PLUGIN Setting の %if の中で @status-info をそれぞれ設定する

# Window Status
setw -g window-status-separator "" # window間の隙間を排除
set-option -g status-justify 'left'   # window-status を左寄せ
# 非アクティブウィンドウ（番号と名前）
setw -g window-status-format '#[fg=#21252b, bg=#3e4452]#[fg=#dcdcdc, bg=#3e4452, bold] #I:#{T:@wname} #[fg=#3e4452, bg=#21252b]'
# アクティブウィンドウ（番号と名前）
setw -g window-status-current-format '#[fg=#21252b, bg=#61afef]#[fg=#21252b, bg=#61afef, bold] #I:#{T:@wname} #[fg=#61afef, bg=#21252b]'

# ウィンドウ名の長さ: 1 段に収まるように、((画面の幅 - 63) / ウィンドウ数 - 7) 文字で切り、… を付ける
# （63 は status-left の 17（セッション名は最大 10 文字＋…・":番号"・空白・区切り記号）と、status-right の 46
#   （Wait / Copy の 6、区切り記号・空白・絵文字・" | " の 9、フォルダ名を 16 文字とみた分、時刻の 15）を足したもの。
#   7 は名前以外の区切り記号・空白・…・"番号:" の分。psmux は #{=/#{...}/:...} のように長さに #{} を書けないので、
#   幅やウィンドウ数が分からないとき（tmux の起動時でセッションもクライアントも無いとき）は 80 と 1 にする。フックで set -gF し、@wname に "#{=/11/…:window_name}" のような書式を作って #{T:@wname} で展開する）
set -gF @wname '##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},63},#{?session_windows,#{session_windows},1}},7}/…:window_name}'
set-hook -g client-resized 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},63},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'
set-hook -g after-new-window 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},63},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'
set-hook -g window-unlinked 'set -gF @wname "##{=/#{e|-:#{e|/:#{e|-:#{?client_width,#{client_width},#{?window_width,#{window_width},80}},63},#{?session_windows,#{session_windows},1}},7}/…:window_name}"'

#################################################
#
#  PANE Setting
#

#  ベーシックペイン
set -g window-style 'fg=colour245, bg=colour234'

#  アクティブペイン
set -g window-active-style 'fg=white, bg=colour236'

#  Extended Keys（tmux のみ。psmux はこの 2 つのオプションに対応しておらず、起動時に警告が出るため読み込まない）
%if "#{!:#{m:*psmux*,#{socket_path}}}"
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:RGB'   # ステータスバーの #RRGGBB の色をそのまま出す（24 ビットカラー）
%endif
#  Ctrl+Enter: psmux は Windows で LF に変えて渡す（#409）ため、CSI u（ESC[13;5u）をそのまま送る
bind -n C-Enter send-keys -H 1b 5b 31 33 3b 35 75

#################################################
#
#  PLUGIN Setting
#
#  tmux は tpm、psmux（Windows）は ppm（tpm の PowerShell 版）でプラグインを管理する
#  socket_path に psmux が含まれるか（psmux は ~/.psmux/<名前>、tmux は /tmp/tmux-<UID>/<名前>）で見分ける
#
#  Prefix + I: プラグインのインストール
#  Prefix + U: プラグインの更新
#  Prefix + Alt-u（tmux）/ Prefix + M（psmux）: リストに無いプラグインの削除

%if "#{m:*psmux*,#{socket_path}}"
# --- psmux: ppm（install_tmux.ps1 が ~/.psmux/plugins/ppm に入れる）
# psmux は @plugin の行で各プラグインの plugin.conf を読み込む
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-resurrect'    # Prefix + Ctrl-s で保存、Prefix + Ctrl-r で復元
set -g @plugin 'psmux-plugins/psmux-continuum'    # 15 分ごとに自動保存

# ステータスバーの右側（tmux 側と同じく、プラグインを使わずに書く）
# - Prefix の表示: psmux-prefix-highlight は status-right を丸ごと上書きするので使わず、client_prefix / pane_in_mode で直接書く（@status-mode）
set -g @status-info '#[fg=#4d78cc, bg=#21252b]#[fg=#ffffff, bg=#4d78cc, bold] #{?@ssh_host,🌐 #{@ssh_host},📁 #{b:pane_current_path}} | %m/%d %H:%M %a '

# ppm のキー（ppm の plugin.conf と同じ）。psmux は ppm の plugin.conf を自動では読まず、
# 下の run でも設定の再読み込み時には登録されなかったので、ここで直接割り当てる
bind I run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/install_plugins.ps1"'
bind U run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/update_plugins.ps1"'
bind M run-shell 'pwsh -NoProfile -ExecutionPolicy Bypass -File "~/.psmux/plugins/ppm/scripts/clean_plugins.ps1"'

# ppm の読み込み（設定ファイルの最後に置く）
run '~/.psmux/plugins/ppm/ppm.ps1'

# psmux-continuum の client-attached フックを -b 付きで上書きする
# （psmux 3.4.0 は attach 時のフックに -b を付けずに実行し、起動時にステータスバーに "running: ..." を出すため）
set-hook -g client-attached 'run-shell -b "pwsh -NoProfile -File \"~/.psmux/plugins/psmux-continuum/scripts/auto_save.ps1\" -IntervalMinutes 15"'

%else
# --- tmux: tpm（install_tmux.sh が ~/.config/tmux/.tmux/plugins/tpm に clone する）
# ppm は設定ファイルの "set -g @plugin" の行を文字列で探してインストールするので、
# psmux に拾わせないように tmux 用の行は set-option と書く
# プラグインは psmux 側と同じもの（resurrect / continuum）にそろえる
set-option -g @plugin 'tmux-plugins/tpm'
#set-option -g @plugin 'tmux-plugins/tmux-online-status'  # https://github.com/tmux-plugins/tmux-online-status
# set-option -g @plugin 'tmux-plugins/tmux-sidebar' # https://github.com/tmux-plugins/tmux-sidebar
set-option -g @plugin 'tmux-plugins/tmux-resurrect' # Prefix + Ctrl-s で保存、Prefix + Ctrl-r で復元
set-option -g @plugin 'tmux-plugins/tmux-continuum' # 15 分ごとに自動保存

# ステータスバーの右側（psmux 側と同じく、プラグインを使わずに書く）
# - Prefix の表示: tmux-prefix-highlight の代わりに client_prefix / pane_in_mode で直接書く（@status-mode）
set -g @status-info '#[fg=#4d78cc, bg=#21252b]#[fg=#ffffff, bg=#4d78cc, bold] #{?@ssh_host,🌐 #{@ssh_host},#{?#{==:#{pane_current_command},ssh},🌐 ssh,📁 #{b:pane_current_path}}} | %m/%d %H:%M %a '

# https://github.com/tmux-plugins/tpm
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
%endif
